<html lang="en">

</head>
<body>
    
<nav class="navbar">

</nav>

<div class="card" id="home">

       <img src="./myphoto .jpg" alt="My picture" width="200">

</p>

        <button id="myButton">Click Me</button>

        <p id="message"></p>
        <button id="colorButton">Change Message</button>
        <button id="resetButton">Reset Counter</button>

<section id="contact" class="card">

    <script>
        const button = document.getElementById("myButton");
        const message = document.getElementById("message");
        const colorButton = document.getElementById("colorButton");

   
const colors = ["lightgreen", "lightblue", "lightpink"];
let colorIndex = 0;

colorButton.addEventListener("click", function() {
    message.textContent = "Great job! You are learning JavaScript!";
    message.style.color = "green";

    document.body.style.backgroundColor = colors[colorIndex];

    colorIndex = colorIndex + 1;

    if (colorIndex === colors.length) {
        colorIndex = 0;
    }
});


        let count = 0;

button.addEventListener("click", function() {
    count = count + 1;

            if (count === 1) {
                message.textContent =
                    "You have clicked the button 1 time!";
            } else {
                message.textContent =
                    "You have clicked the button " + count + " times!";
                    
const resetButton = document.getElementById("resetButton");

resetButton.addEventListener("click", function() {
    count = 0;
    message.textContent = "Counter has been reset to zero!";
});

            }
        });
    </script>
